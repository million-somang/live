[pytest]
testpaths = .
norecursedirs = __pycache__ .git
markers =
    tier1: Tier 1 feature coverage tests
    tier2: Tier 2 boundary and corner-case tests
    tier3: Tier 3 pairwise cross-feature tests
    tier4: Tier 4 real-world operator scenario tests
    f1: Feature 1 - Browser multi-monitor discovery (R1)
    f2: Feature 2 - 3-program monitor assignment UI (R2)
    f3: Feature 3 - Layout persistence and reconnect hydration (R2)
    f4: Feature 4 - Auto-placed and maximized launch (R3)
