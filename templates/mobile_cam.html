<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📱 라이브 방송 무선 스마트폰 카메라 송출기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 뷰파인더 비디오 */
        #cameraVideo {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: #0f172a;
        }

        /* 미러링 (전면 카메라일 때) */
        #cameraVideo.mirrored {
            transform: scaleX(-1);
        }

        /* 숨겨진 전송용 캔버스 */
        #captureCanvas {
            display: none;
        }

        /* 상단 상태 바 */
        .top-status-overlay {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(12px);
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            gap: 8px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            font-weight: 800;
            color: #34d399;
            white-space: nowrap;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
            animation: pulseDot 1s infinite alternate;
            flex-shrink: 0;
        }

        @keyframes pulseDot {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        .fps-badge {
            font-size: 0.74rem;
            color: #bae6fd;
            font-weight: 800;
            background: rgba(14, 165, 233, 0.18);
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 3px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        /* 프레임 수(FPS) 및 해상도 실시간 조절 바 */
        .perf-controls-bar {
            position: absolute;
            bottom: 86px;
            left: 14px;
            right: 14px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .perf-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .perf-label {
            font-size: 0.74rem;
            font-weight: 800;
            color: #94a3b8;
            white-space: nowrap;
            min-width: 56px;
        }

        .perf-chips {
            display: flex;
            gap: 5px;
            flex: 1;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .perf-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #cbd5e1;
            padding: 5px 10px;
            border-radius: 14px;
            font-size: 0.74rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s;
        }

        .perf-chip.active {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            border-color: #7dd3fc;
            color: #fff;
            box-shadow: 0 0 12px rgba(14, 165, 233, 0.45);
        }

        /* 하단 컨트롤러 바 */
        .bottom-controls {
            position: absolute;
            bottom: 20px;
            left: 14px;
            right: 14px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-ctrl {
            background: rgba(15, 23, 42, 0.88);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 12px 16px;
            border-radius: 24px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.15s;
        }

        .btn-ctrl:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-stream-toggle {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-color: #f87171;
            padding: 13px 22px;
            font-size: 0.95rem;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        .btn-stream-toggle.streaming {
            background: linear-gradient(135deg, #10b981, #059669);
            border-color: #6ee7b7;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }

        /* 시작 전 안내 및 상태 레이어 */
        .start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            gap: 16px;
            overflow-y: auto;
        }

        .start-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 900;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5);
            cursor: pointer;
            width: 100%;
            max-width: 340px;
            transition: transform 0.15s;
        }

        .start-btn:active {
            transform: scale(0.97);
        }

        .https-btn {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: #fff;
            border: 1.5px solid #7dd3fc;
            padding: 15px 24px;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 28px;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.45);
            cursor: pointer;
            width: 100%;
            max-width: 340px;
            text-decoration: none;
            display: inline-block;
        }

        .notice-box {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(248, 113, 113, 0.45);
            border-radius: 16px;
            padding: 16px;
            max-width: 360px;
            width: 100%;
            font-size: 0.84rem;
            line-height: 1.5;
            color: #e2e8f0;
            text-align: left;
        }

        .notice-box.info {
            border-color: rgba(56, 189, 248, 0.45);
        }
    </style>
</head>
<body>

    <!-- 1. 카메라 비디오 뷰파인더 -->
    <video id="cameraVideo" autoplay playsinline webkit-playsinline muted></video>
    <canvas id="captureCanvas"></canvas>

    <!-- 2. 상단 상태 바 -->
    <div class="top-status-overlay">
        <div class="status-badge" id="connStatus">
            <span class="live-dot" id="statusDot"></span>
            <span id="statusText">송출 준비 중</span>
        </div>
        <div style="display:flex; align-items:center; gap:5px;">
            <button type="button" id="btnTopCam1" onclick="selectCamChannel(1)" style="border:1.5px solid #38bdf8; background:rgba(14,165,233,0.32); color:#fff; font-size:0.72rem; font-weight:900; padding:4px 9px; border-radius:14px; cursor:pointer;">🎥 CAM 1</button>
            <button type="button" id="btnTopCam2" onclick="selectCamChannel(2)" style="border:1px solid rgba(255,255,255,0.22); background:rgba(255,255,255,0.08); color:#cbd5e1; font-size:0.72rem; font-weight:800; padding:4px 9px; border-radius:14px; cursor:pointer;">🔎 CAM 2</button>
        </div>
        <div class="fps-badge" id="statsText">
            30 FPS • 720p HD
        </div>
    </div>

    <!-- 3. 프레임 수(FPS) 및 해상도 실시간 조절 컨트롤 패널 -->
    <div class="perf-controls-bar" id="perfControlsBar">
        <div class="perf-row">
            <span class="perf-label">🎞️ 프레임 수</span>
            <div class="perf-chips" id="fpsChipsGroup">
                <button type="button" class="perf-chip" data-fps="15" onclick="setTargetFps(15)">15 FPS</button>
                <button type="button" class="perf-chip" data-fps="24" onclick="setTargetFps(24)">24 FPS</button>
                <button type="button" class="perf-chip active" data-fps="30" onclick="setTargetFps(30)">30 FPS</button>
                <button type="button" class="perf-chip" data-fps="60" onclick="setTargetFps(60)">60 FPS</button>
            </div>
        </div>
        <div class="perf-row">
            <span class="perf-label">📐 화질/속도</span>
            <div class="perf-chips" id="resChipsGroup">
                <button type="button" class="perf-chip" data-res="360" onclick="setTargetResolution(360, 0.58)">⚡ 360p 초고속</button>
                <button type="button" class="perf-chip" data-res="480" onclick="setTargetResolution(480, 0.68)">⚖️ 480p 표준</button>
                <button type="button" class="perf-chip active" data-res="720" onclick="setTargetResolution(720, 0.74)">💎 720p HD</button>
                <button type="button" class="perf-chip" data-res="1080" onclick="setTargetResolution(1080, 0.80)">✨ 1080p FHD</button>
            </div>
        </div>
        <div class="perf-row">
            <span class="perf-label">🎙️ 음성 수음</span>
            <div class="perf-chips" id="micModeChipsGroup">
                <button type="button" class="perf-chip active" data-micmode="broadcast" onclick="setMicPickupMode('broadcast')">🎙️ 방송 고감도 (끊김방지·권장)</button>
                <button type="button" class="perf-chip" data-micmode="denoise" onclick="setMicPickupMode('denoise')">🛡️ 강제 소음차단</button>
            </div>
        </div>
    </div>

    <!-- 4. 하단 컨트롤 바 -->
    <div class="bottom-controls">
        <!-- 전면 / 후면 카메라 전환 -->
        <button type="button" class="btn-ctrl" onclick="switchCamera()">
            🔄 <span id="cameraFaceText">후면 카메라</span>
        </button>

        <!-- 마이크 음성 송출 ON / OFF -->
        <button type="button" class="btn-ctrl" id="btnMicToggle" onclick="toggleMicMute()" style="border-color: rgba(56, 189, 248, 0.6); background: rgba(14, 165, 233, 0.25);">
            🎤 <span id="micStatusText">마이크 ON</span>
        </button>

        <!-- 송출 시작 / 일시정지 -->
        <button type="button" class="btn-ctrl btn-stream-toggle streaming" id="btnStreamToggle" onclick="toggleStreaming()">
            🔴 무선 송출 중
        </button>
    </div>

    <!-- 5. 최초 시작 허용 및 보안/권한 안내 오버레이 -->
    <div class="start-overlay" id="startOverlay">
        <div style="font-size:3rem;">📱</div>
        <h2 style="font-size:1.35rem; font-weight:900;">스마트폰 무선 카메라 송출</h2>
        <p style="font-size:0.88rem; color:#94a3b8; line-height:1.5; max-width:340px;">
            <strong>⚡ WebRTC Wi-Fi P2P 직결 엔진</strong>으로<br>PC 스튜디오 및 OBS 화면에 무지연 실시간 전송됩니다.
        </p>

        <!-- 🎥 듀얼 카메라 채널(CAM 1 / CAM 2) 선택 -->
        <div style="display:flex; gap:8px; width:100%; max-width:340px; justify-content:center;">
            <button type="button" id="btnStartCam1" onclick="selectCamChannel(1)" style="flex:1; padding:11px 10px; border-radius:16px; border:2px solid #38bdf8; background:rgba(14,165,233,0.28); color:#fff; font-size:0.86rem; font-weight:900; cursor:pointer;">
                🎥 CAM 1 (메인/정면)
            </button>
            <button type="button" id="btnStartCam2" onclick="selectCamChannel(2)" style="flex:1; padding:11px 10px; border-radius:16px; border:1.5px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.06); color:#cbd5e1; font-size:0.86rem; font-weight:800; cursor:pointer;">
                🔎 CAM 2 (서브/디테일)
            </button>
        </div>

        <!-- HTTP 비보안 접속 시 자동 표시되는 HTTPS 전환 안내 박스 -->
        <div class="notice-box info" id="httpsRedirectBox" style="display:none;">
            <div style="font-weight:900; color:#38bdf8; margin-bottom:6px; font-size:0.92rem;">
                🔒 모바일 카메라 보안(HTTPS) 연결 필요
            </div>
            <div style="color:#cbd5e1; margin-bottom:12px;">
                스마트폰 브라우저는 보안 정책상 <strong>HTTPS 보안 연결</strong>에서만 실시간 카메라 권한을 허용합니다.<br>
                아래 버튼을 누르면 즉시 보안 카메라 모드로 연결됩니다.
            </div>
            <a id="btnGoHttps" href="#" class="https-btn" style="text-align:center;">
                🔒 보안(HTTPS) 카메라 모드로 이동
            </a>
        </div>

        <!-- 카메라 오류/권한 안내 박스 -->
        <div class="notice-box" id="cameraErrorBox" style="display:none;">
            <div style="font-weight:900; color:#f87171; margin-bottom:6px;" id="cameraErrorTitle">
                ⚠️ 카메라를 시작할 수 없습니다
            </div>
            <div id="cameraErrorMsg" style="color:#cbd5e1;"></div>
        </div>

        <button type="button" class="start-btn" id="btnStartCam" onclick="initAndStartCamera()">
            📷 카메라 켜고 송출 시작
        </button>

        <!-- 인앱 브라우저/비상시 기본 카메라 앱 캡처 폴백 -->
        <div style="margin-top:4px;">
            <label for="nativeCamInput" style="font-size:0.8rem; color:#94a3b8; text-decoration:underline; cursor:pointer;">
                카메라 권한이 안 뜰 때: 기본 카메라로 즉시 사진 송출하기
            </label>
            <input type="file" id="nativeCamInput" accept="image/*" capture="environment" style="display:none;" onchange="handleNativeCamCapture(this)">
        </div>
    </div>

    <script>
        const HTTPS_PORT = {{ https_port | default(5443) }};
        const LOCAL_WIFI_IP = {{ (local_ip or '') | tojson }};
        const PUBLIC_TUNNEL_URL = {{ (public_tunnel_url or '') | tojson }};
        const INITIAL_CAM_ID = {{ cam_id | default(1) }};
        const CAM_TOKEN = (new URLSearchParams(window.location.search).get('cam_token') || {{ (cam_token or '') | tojson }} || '').trim();
        const IS_TUNNEL_HOST = window.location.hostname.endsWith('.lhr.life') || window.location.hostname.endsWith('.localhost.run') || window.location.hostname.endsWith('.trycloudflare.com');
        let currentCamId = (new URLSearchParams(window.location.search).get('cam') === '2' || INITIAL_CAM_ID === 2) ? 2 : 1;
        let currentFacing = 'environment'; // 'environment'(후면) or 'user'(전면)
        let currentStream = null;
        let isStreaming = true;
        let frameLoopStarted = false;

        // 자체 서명 인증서(:5443) 환경에서 모바일 브라우저가 세션 쿠키를 차단하더라도 403이 발생하지 않도록 모든 카메라 API 요청에 cam_token 자동 부착
        (function installMobileCamTokenFetchWrapper() {
            if (!CAM_TOKEN || !window.fetch) return;
            const origFetch = window.fetch.bind(window);
            window.fetch = function (input, init) {
                let urlStr = typeof input === 'string' ? input : (input && input.url ? input.url : String(input));
                if (urlStr.includes('/api/camera/') && !urlStr.includes('cam_token=')) {
                    const sep = urlStr.includes('?') ? '&' : '?';
                    urlStr = `${urlStr}${sep}cam_token=${encodeURIComponent(CAM_TOKEN)}`;
                }
                const nextInit = Object.assign({}, init || {});
                try {
                    const hdrs = new Headers(nextInit.headers || {});
                    if (!hdrs.has('X-Cam-Token')) {
                        hdrs.set('X-Cam-Token', CAM_TOKEN);
                    }
                    nextInit.headers = hdrs;
                } catch (e) {}
                return origFetch(urlStr, nextInit);
            };
        })();

        function reportClientLog(state, message) {
            try {
                fetch(`/api/camera/client-log?cam=${currentCamId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cam: currentCamId,
                        state: state,
                        message: message || '',
                        protocol: window.location.protocol,
                        ua: navigator.userAgent || ''
                    })
                }).catch(() => {});
            } catch (e) {}
        }

        function dataUrlToUint8Array(dataUrl) {
            try {
                const commaIdx = dataUrl.indexOf(',');
                if (commaIdx < 0) return null;
                const b64 = dataUrl.slice(commaIdx + 1);
                const binStr = atob(b64);
                const len = binStr.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binStr.charCodeAt(i);
                }
                return bytes;
            } catch (e) {
                return null;
            }
        }

        // 카메라 시작 즉시 첫 연결 확인 프레임을 전송하여 스튜디오에서 0.3초 내에 '연결됨'으로 전환
        function sendInitialConnectionFrame() {
            try {
                const video = document.getElementById('cameraVideo');
                const canvas = document.getElementById('captureCanvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d', { alpha: false });
                const vw = (video && video.videoWidth > 0) ? video.videoWidth : 640;
                const vh = (video && video.videoHeight > 0) ? video.videoHeight : 360;
                canvas.width = vw;
                canvas.height = vh;
                if (video && video.readyState >= 2 && video.videoWidth > 0) {
                    ctx.drawImage(video, 0, 0, vw, vh);
                } else {
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(0, 0, vw, vh);
                    ctx.fillStyle = '#38bdf8';
                    ctx.font = 'bold 24px sans-serif';
                    ctx.fillText(`CAM ${currentCamId} 카메라 스트림 연결됨`, 36, Math.round(vh / 2));
                }
                const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
                const payload = dataUrlToUint8Array(dataUrl);
                if (payload) {
                    const mySeq = ++frameSeq;
                    fetch(`/api/camera/frame?cam=${currentCamId}&seq=${mySeq}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'image/jpeg' },
                        body: payload
                    }).catch(() => {});
                }
            } catch (e) {}
        }

        function updateCamChannelButtons() {
            const top1 = document.getElementById('btnTopCam1');
            const top2 = document.getElementById('btnTopCam2');
            const st1 = document.getElementById('btnStartCam1');
            const st2 = document.getElementById('btnStartCam2');
            const isC1 = (currentCamId === 1);
            if (top1) {
                top1.style.border = isC1 ? '1.5px solid #38bdf8' : '1px solid rgba(255,255,255,0.22)';
                top1.style.background = isC1 ? 'rgba(14,165,233,0.35)' : 'rgba(255,255,255,0.08)';
                top1.style.color = isC1 ? '#fff' : '#cbd5e1';
            }
            if (top2) {
                top2.style.border = !isC1 ? '1.5px solid #c084fc' : '1px solid rgba(255,255,255,0.22)';
                top2.style.background = !isC1 ? 'rgba(168,85,247,0.35)' : 'rgba(255,255,255,0.08)';
                top2.style.color = !isC1 ? '#fff' : '#cbd5e1';
            }
            if (st1) {
                st1.style.border = isC1 ? '2px solid #38bdf8' : '1.5px solid rgba(255,255,255,0.2)';
                st1.style.background = isC1 ? 'rgba(14,165,233,0.28)' : 'rgba(255,255,255,0.06)';
                st1.style.color = isC1 ? '#fff' : '#cbd5e1';
            }
            if (st2) {
                st2.style.border = !isC1 ? '2px solid #c084fc' : '1.5px solid rgba(255,255,255,0.2)';
                st2.style.background = !isC1 ? 'rgba(168,85,247,0.28)' : 'rgba(255,255,255,0.06)';
                st2.style.color = !isC1 ? '#fff' : '#cbd5e1';
            }
        }

        async function selectCamChannel(camNum) {
            currentCamId = (Number(camNum) === 2) ? 2 : 1;
            frameSeq = 0;
            try {
                const url = new URL(window.location.href);
                url.searchParams.set('cam', String(currentCamId));
                window.history.replaceState({}, '', url.toString());
            } catch (e) {}
            try {
                const savedMicMute = localStorage.getItem(`live_cam_mic_muted_cam${currentCamId}`);
                if (currentCamId === 2) {

        // ==========================================
        // 🎤 스마트폰 마이크 실시간 PCM 오디오 캡처 & 서버(유튜브 RTMP) 송출
        // ==========================================
        let audioWorkletReady = false;

        function ensureAudioUploadWorker() {
            if (audioUploadWorker) return audioUploadWorker;
            if (typeof Worker === 'undefined') return null;
            const workerCode = `
                let uploadUrlBase = '';
                let isActive = false;
                let audioInFlightCount = 0;
                const MAX_AUDIO_IN_FLIGHT = 1;
                const AUDIO_PACKET_SAMPLES = 3840;
                const MAX_BUFFER_SAMPLES = 36000;
                let audioSeq = 0;
                let pendingPcmChunks = [];
                let pendingPcmSamples = 0;

                function onPcmChunk(pcm16) {
                    if (!isActive || !pcm16 || !pcm16.length) return;
                    pendingPcmChunks.push(pcm16);
                    pendingPcmSamples += pcm16.length;
                    if (pendingPcmSamples >= AUDIO_PACKET_SAMPLES && audioInFlightCount < MAX_AUDIO_IN_FLIGHT) {
                        flushAudioChunks();
                    }
                }

                async function flushAudioChunks() {
                    if (!isActive || !uploadUrlBase || audioInFlightCount >= MAX_AUDIO_IN_FLIGHT || pendingPcmSamples < AUDIO_PACKET_SAMPLES) return;
                    audioInFlightCount++;
                    const mySeq = ++audioSeq;
                    try {
                        const chunks = pendingPcmChunks;
                        const totalSamples = pendingPcmSamples;
                        pendingPcmChunks = [];
                        pendingPcmSamples = 0;

                        const merged = new Int16Array(totalSamples);
                        let offset = 0;
                        for (let i = 0; i < chunks.length; i++) {
                            merged.set(chunks[i], offset);
                            offset += chunks[i].length;
                        }
                        const payload = totalSamples > MAX_BUFFER_SAMPLES
                            ? merged.subarray(totalSamples - MAX_BUFFER_SAMPLES)
                            : merged;

                        const sep = uploadUrlBase.includes('?') ? '&' : '?';
                        const url = uploadUrlBase + sep + 'seq=' + mySeq;
                        const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
                        const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, 1500) : null;
                        try {
                            await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/octet-stream' },
                                body: new Uint8Array(payload.buffer, payload.byteOffset, payload.byteLength),
                                signal: ctrl ? ctrl.signal : undefined
                            });
                        } finally {
                            if (timer) clearTimeout(timer);
                        }
                    } catch (e) {
                    } finally {
                        audioInFlightCount = Math.max(0, audioInFlightCount - 1);
                        if (pendingPcmSamples >= AUDIO_PACKET_SAMPLES && audioInFlightCount < MAX_AUDIO_IN_FLIGHT) {
                            flushAudioChunks();
                        }
                    }
                }

                self.onmessage = (ev) => {
                    const msg = ev.data || {};
                    if (msg.type === 'config') {
                        if (typeof msg.uploadUrlBase === 'string') uploadUrlBase = msg.uploadUrlBase;
                        if (typeof msg.active === 'boolean') {
                            isActive = msg.active;
                            if (!isActive) {
                                pendingPcmChunks = [];
                                pendingPcmSamples = 0;
                            }
                        }
                    } else if (msg.type === 'bindPort' && msg.port) {
                        msg.port.onmessage = (pEv) => {
                            onPcmChunk(pEv.data);
                        };
                    } else if (msg.type === 'pcm' && msg.pcm) {
                        onPcmChunk(msg.pcm);
                    }
                };
            `;
            try {
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                audioUploadWorker = new Worker(URL.createObjectURL(blob));
            } catch (e) {
                try {
                    const wUrl = CAM_TOKEN
                        ? `/api/camera/audio-worker.js?cam_token=${encodeURIComponent(CAM_TOKEN)}`
                        : '/api/camera/audio-worker.js';
                    audioUploadWorker = new Worker(wUrl);
                } catch (e2) {
                    audioUploadWorker = null;
                }
            }
            return audioUploadWorker;
        }

        function syncAudioWorkerConfig() {
            const w = ensureAudioUploadWorker();
            if (!w) return;
            const tokPart = CAM_TOKEN ? `&cam_token=${encodeURIComponent(CAM_TOKEN)}` : '';
            const fullBase = new URL(`/api/camera/audio?sr=48000&src=mobile&cam=${currentCamId}${tokPart}`, window.location.origin).toString();
            w.postMessage({
                type: 'config',
                uploadUrlBase: fullBase,
                active: Boolean(isStreaming && !isMicMuted && hasAudioTrack)
            });
        }

        function attachScriptProcessorFallback(inRate) {
            if (!audioCtx || !audioSourceNode || !audioGainNode) return;
            try {
                if (audioProcessorNode) {
                    try { audioProcessorNode.disconnect(); } catch (e) {}
                }
                audioProcessorNode = audioCtx.createScriptProcessor(4096, 1, 1);
                const effRate = inRate || audioCtx.sampleRate || 48000;
                const ratio = effRate / TARGET_AUDIO_SAMPLE_RATE;
                let spDcX = 0, spDcY = 0, spPrevSample = 0, spHasPrev = false, spSrcPos = 0;
                const worker = ensureAudioUploadWorker();
                syncAudioWorkerConfig();
                audioProcessorNode.onaudioprocess = (event) => {
                    if (!isStreaming || isMicMuted || !hasAudioTrack) return;
                    const inputData = event.inputBuffer.getChannelData(0);
                    if (!inputData || inputData.length === 0) return;
                    const inLen = inputData.length;
                    const fBuf = new Float32Array(inLen);
                    for (let i = 0; i < inLen; i++) {
                        const x = inputData[i];
                        spDcY = x - spDcX + 0.995 * spDcY;
                        spDcX = x;
                        fBuf[i] = spDcY;
                    }

                    let pcm16;
                    if (Math.abs(ratio - 1.0) < 0.001) {
                        pcm16 = new Int16Array(inLen);
                        for (let i = 0; i < inLen; i++) {
                            let s = fBuf[i];
                            if (s > 0.98) s = 0.98;
                            else if (s < -0.98) s = -0.98;
                            pcm16[i] = s < 0 ? Math.round(s * 0x8000) : Math.round(s * 0x7FFF);
                        }
                        spPrevSample = fBuf[inLen - 1];
                        spHasPrev = true;
                    } else {
                        if (!spHasPrev) {
                            spPrevSample = fBuf[0];
                            spHasPrev = true;
                            spSrcPos = 0;
                        }
                        const maxOut = Math.ceil((inLen + 2) / ratio) + 2;
                        const tmp = new Int16Array(maxOut);
                        let outIdx = 0;
                        const limit = inLen - 1;
                        while (spSrcPos < limit) {
                            const idx = Math.floor(spSrcPos);
                            const frac = spSrcPos - idx;
                            const s0 = idx < 0 ? spPrevSample : fBuf[idx];
                            const s1 = idx < 0 ? fBuf[0] : fBuf[idx + 1];
                            let s = s0 * (1 - frac) + s1 * frac;
                            if (s > 0.98) s = 0.98;
                            else if (s < -0.98) s = -0.98;
                            tmp[outIdx++] = s < 0 ? Math.round(s * 0x8000) : Math.round(s * 0x7FFF);
                            spSrcPos += ratio;
                        }
                        spPrevSample = fBuf[inLen - 1];
                        spSrcPos -= inLen;
                        pcm16 = tmp.subarray(0, outIdx);
                    }

                    if (worker) {
                        const copy = new Int16Array(pcm16);
                        worker.postMessage({ type: 'pcm', pcm: copy }, [copy.buffer]);
                    } else {
                        pendingPcmChunks.push(pcm16);
                        pendingPcmSamples += pcm16.length;

                        if (pendingPcmSamples >= AUDIO_PACKET_SAMPLES && audioInFlightCount < MAX_AUDIO_IN_FLIGHT) {
                            flushAudioPcmChunks();
                        }
                    }
                };

                audioSourceNode.connect(audioProcessorNode);
                audioProcessorNode.connect(audioGainNode);
                audioGainNode.connect(audioCtx.destination);
            } catch (e) {}
        }

        async function setupAudioCapture(stream) {
            try {
                const audioTracks = stream ? stream.getAudioTracks() : [];
                hasAudioTrack = audioTracks.length > 0;
                if (!hasAudioTrack) {
                    syncAudioWorkerConfig();
                    updateMicButtonUi();
                    return;
                }
                audioTracks.forEach(t => { t.enabled = !isMicMuted && isStreaming; });
                syncAudioWorkerConfig();
                updateMicButtonUi();

                if (audioProcessorNode) {
                    try { audioProcessorNode.disconnect(); } catch (e) {}
                    audioProcessorNode = null;
                }
                if (audioSourceNode) {
                    try { audioSourceNode.disconnect(); } catch (e) {}
                    audioSourceNode = null;
                }

                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                if (!audioCtx) {
                    try {
                        audioCtx = new AudioContextClass({ sampleRate: 48000 });
                    } catch (e) {
                        audioCtx = new AudioContextClass();
                    }
                    audioCtx.onstatechange = () => {
                        updateMicButtonUi();
                        updateStatusDisplay();
                    };
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }

                const dedicatedAudioStream = new MediaStream([audioTracks[0]]);
                audioSourceNode = audioCtx.createMediaStreamSource(dedicatedAudioStream);
                audioGainNode = audioCtx.createGain();
                audioGainNode.gain.value = 0; // 폰 스피커 하울링 방지 (무음 출력 노드)

                const inRate = audioCtx.sampleRate || 48000;

                // 1순위: 전용 실시간 오디오 스레드(AudioWorkletNode) + 전용 업로드 Web Worker 사용 -> 메인 스레드 캔버스 부하와 무관하게 100% 무손실 캡처·전송
                if (audioCtx.audioWorklet && window.AudioWorkletNode) {
                    try {
                        if (!audioWorkletReady) {
                            try {
                                const workletUrl = CAM_TOKEN
                                    ? `/api/camera/mic-worklet.js?cam_token=${encodeURIComponent(CAM_TOKEN)}`
                                    : '/api/camera/mic-worklet.js';
                                await audioCtx.audioWorklet.addModule(workletUrl);
                                audioWorkletReady = true;
                            } catch (modErr) {
                                const workletCode = `
                                    class MicPcmWorklet extends AudioWorkletProcessor {
                                        constructor() {
                                            super();
                                            this.outBuf = new Int16Array(1920);
                                            this.outIdx = 0;
                                            this.srcPos = 0;
                                            this.dcX = 0;
                                            this.dcY = 0;
                                            this.prevSample = 0;
                                            this.hasPrev = false;
                                            this.filteredBuf = new Float32Array(256);
                                            this.workerPort = null;
                                            this.notifiedAlive = false;
                                            this.port.onmessage = (ev) => {
                                                if (ev.data && ev.data.workerPort) {
                                                    this.workerPort = ev.data.workerPort;
                                                }
                                            };
                                        }
                                        emitSample(s) {
                                            if (s > 0.98) s = 0.98;
                                            else if (s < -0.98) s = -0.98;
                                            this.outBuf[this.outIdx++] = s < 0 ? Math.round(s * 0x8000) : Math.round(s * 0x7FFF);
                                            if (this.outIdx >= 1920) {
                                                const chunk = this.outBuf.slice(0);
                                                if (this.workerPort) {
                                                    this.workerPort.postMessage(chunk, [chunk.buffer]);
                                                    if (!this.notifiedAlive) {
                                                        this.notifiedAlive = true;
                                                        this.port.postMessage('alive');
                                                    }
                                                } else {
                                                    this.port.postMessage(chunk, [chunk.buffer]);
                                                }
                                                this.outIdx = 0;
                                            }
                                        }
                                        process(inputs) {
                                            const input = inputs[0];
                                            if (!input || !input[0] || input[0].length === 0) return true;
                                            const ch = input[0];
                                            const inLen = ch.length;
                                            if (this.filteredBuf.length < inLen) {
                                                this.filteredBuf = new Float32Array(inLen);
                                            }
                                            let dcX = this.dcX, dcY = this.dcY;
                                            for (let i = 0; i < inLen; i++) {
                                                const x = ch[i];
                                                dcY = x - dcX + 0.995 * dcY;
                                                dcX = x;
                                                this.filteredBuf[i] = dcY;
                                            }
                                            this.dcX = dcX;
                                            this.dcY = dcY;

                                            const fBuf = this.filteredBuf;
                                            if (sampleRate === 48000) {
                                                for (let i = 0; i < inLen; i++) {
                                                    this.emitSample(fBuf[i]);
                                                }
                                                this.prevSample = fBuf[inLen - 1];
                                                this.hasPrev = true;
                                                return true;
                                            }
                                            const ratio = sampleRate / 48000;
                                            if (!this.hasPrev) {
                                                this.prevSample = fBuf[0];
                                                this.hasPrev = true;
                                                this.srcPos = 0;
                                            }
                                            const limit = inLen - 1;
                                            while (this.srcPos < limit) {
                                                const idx = Math.floor(this.srcPos);
                                                const frac = this.srcPos - idx;
                                                const s0 = idx < 0 ? this.prevSample : fBuf[idx];
                                                const s1 = idx < 0 ? fBuf[0] : fBuf[idx + 1];
                                                this.emitSample(s0 * (1 - frac) + s1 * frac);
                                                this.srcPos += ratio;
                                            }
                                            this.prevSample = fBuf[inLen - 1];
                                            this.srcPos -= inLen;
                                            return true;
                                        }
                                    }
                                    registerProcessor('mic-pcm-worklet', MicPcmWorklet);
                                `;
                                const blob = new Blob([workletCode], { type: 'application/javascript' });
                                const url = URL.createObjectURL(blob);
                                await audioCtx.audioWorklet.addModule(url);
                                audioWorkletReady = true;
                            }
                        }
                        let workletDeliveries = 0;
                        const workletNode = new AudioWorkletNode(audioCtx, 'mic-pcm-worklet');
                        audioProcessorNode = workletNode;
                        const worker = ensureAudioUploadWorker();
                        syncAudioWorkerConfig();
                        if (worker && typeof MessageChannel !== 'undefined') {
                            try {
                                const mc = new MessageChannel();
                                workletNode.port.postMessage({ workerPort: mc.port1 }, [mc.port1]);
                                worker.postMessage({ type: 'bindPort', port: mc.port2 }, [mc.port2]);
                            } catch (mcErr) {}
                        }
                        workletNode.port.onmessage = (ev) => {
                            workletDeliveries++;
                            if (ev.data === 'alive') return;
                            if (!isStreaming || isMicMuted || !hasAudioTrack) return;
                            const pcm16 = ev.data;
                            if (!pcm16 || !pcm16.length) return;
                            if (worker) {
                                worker.postMessage({ type: 'pcm', pcm: pcm16 }, [pcm16.buffer]);
                            } else {
                                pendingPcmChunks.push(pcm16);
                                pendingPcmSamples += pcm16.length;
                                if (pendingPcmSamples >= AUDIO_PACKET_SAMPLES && audioInFlightCount < MAX_AUDIO_IN_FLIGHT) {
                                    flushAudioPcmChunks();
                                }
                            }
                        };
                        audioSourceNode.connect(workletNode);
                        workletNode.connect(audioGainNode);
                        audioGainNode.connect(audioCtx.destination);

                        // AudioContext가 실제로 running 상태인 시간 기준 2.5초 동안 콜백이 전혀 없을 때만 ScriptProcessor로 폴백
                        let runningWaitTicks = 0;
                        const fbTimer = setInterval(() => {
                            if (workletDeliveries > 0 || audioProcessorNode !== workletNode) {
                                clearInterval(fbTimer);
                                return;
                            }
                            if (isStreaming && !isMicMuted && hasAudioTrack && audioCtx && audioCtx.state === 'running') {
                                runningWaitTicks++;
                                if (runningWaitTicks >= 5) {
                                    clearInterval(fbTimer);
                                    attachScriptProcessorFallback(inRate);
                                }
                            }
                        }, 500);
                        return;
                    } catch (wErr) {
                        // AudioWorklet 지원 불가 시 아래 ScriptProcessor로 즉시 폴백
                    }
                }

                // 폴백: 4096 샘플(85ms) 버퍼를 사용하여 메인스레드 JPEG 인코딩 중에도 버퍼 드롭 원천 차단
                attachScriptProcessorFallback(inRate);
            } catch (e) {}
        }

        async function flushAudioPcmChunks() {
            if (audioInFlightCount >= MAX_AUDIO_IN_FLIGHT || pendingPcmSamples < AUDIO_PACKET_SAMPLES) return;
            audioInFlightCount++;
            const myAudioSeq = ++audioSeq;
            try {
                const chunks = pendingPcmChunks;
                const totalSamples = pendingPcmSamples;
                pendingPcmChunks = [];
                pendingPcmSamples = 0;

                // 최대 0.75초(36000 샘플) 이하로 유지하여 일시적 Wi-Fi 지연에서도 음절 유실 방지
                const merged = new Int16Array(totalSamples);
                let offset = 0;
                for (const c of chunks) {
                    merged.set(c, offset);
                    offset += c.length;
                }
                const payload = totalSamples > 36000 ? merged.subarray(totalSamples - 36000) : merged;

                const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
                const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, 1500) : null;
                try {
                    await fetch(`/api/camera/audio?sr=48000&src=mobile&cam=${currentCamId}&seq=${myAudioSeq}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/octet-stream' },
                        body: new Uint8Array(payload.buffer, payload.byteOffset, payload.byteLength),
                        signal: ctrl ? ctrl.signal : undefined
                    });
                } finally {
                    if (timer) clearTimeout(timer);
                }
            } catch (e) {
            } finally {
                audioInFlightCount = Math.max(0, audioInFlightCount - 1);
                if (pendingPcmSamples >= AUDIO_PACKET_SAMPLES && audioInFlightCount < MAX_AUDIO_IN_FLIGHT) {
                    flushAudioPcmChunks();
                }
            }
        }

        async function startCamera(facingMode, forceAudio = false) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }

            const idealW = Math.round(targetResHeight * (16 / 9));
            // echoCancellation: true 설정 시 스마트폰 OS가 '근거리 통화(수화기) 모드'로 전환되어 50cm 밖 원거리 음성을 차단하므로 false로 설정하고, AGC로 원거리 음성을 수음합니다.
            const audioConstraints = {
                echoCancellation: false,
                noiseSuppression: true,
                autoGainControl: true,
                channelCount: { ideal: 1 },
                sampleRate: { ideal: 48000 }
            };
            // CAM 2(서브 카메라) 또는 마이크가 음소거된 상태에서는 비디오 단독(audio: false)을 1순위로 요청하여
            // 마이크 권한 팝업/자동재생(video.play) 블로킹 및 CAM 1과의 오디오 충돌을 원천 차단합니다!
            const preferVideoOnly = (currentCamId === 2 && !forceAudio && isMicMuted);
            const constraintCandidates = preferVideoOnly
                ? [
                    {
                        video: {
                            facingMode: { ideal: facingMode },
                            width: { ideal: idealW },
                            height: { ideal: targetResHeight },
                            frameRate: { ideal: targetFps }
                        },
                        audio: false
                    },
                    {
                        video: { facingMode: facingMode },
                        audio: false
                    },
                    {
                        video: true,
                        audio: false
                    }
                ]
                : [
                    {
                        video: {
                            facingMode: { ideal: facingMode },
                            width: { ideal: idealW },
                            height: { ideal: targetResHeight },
                            frameRate: { ideal: targetFps }
                        },
                        audio: audioConstraints
                    },
                    {
                        video: { facingMode: facingMode },
                        audio: audioConstraints
                    },
                    {
                        video: {
                            facingMode: { ideal: facingMode },
                            width: { ideal: idealW },
                            height: { ideal: targetResHeight },
                            frameRate: { ideal: targetFps }
                        },
                        audio: true
                    },
                    {
                        video: { facingMode: facingMode },
                        audio: true
                    },
                    {
                        video: true,
                        audio: true
                    },
                    {
                        video: {
                            facingMode: { ideal: facingMode },
                            width: { ideal: idealW },
                            height: { ideal: targetResHeight },
                            frameRate: { ideal: targetFps }
                        },
                        audio: false
                    },
                    {
                        video: { facingMode: facingMode },
                        audio: false
                    },
                    {
                        video: true,
                        audio: false
                    }
                ];

            reportClientLog('requesting_camera', `CAM ${currentCamId} 카메라 권한 요청 중 (videoOnly=${preferVideoOnly})`);

            let lastErr = null;
            for (const constraints of constraintCandidates) {
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                    if (currentStream) break;
                } catch (err) {
                    lastErr = err;
                }
            }

            // 비디오 단독 후보로 폴백되었으나 마이크가 필요한 경우, 오디오 트랙을 별도로 요청하여 결합 시도
            if (currentStream && !preferVideoOnly && !isMicMuted && currentStream.getAudioTracks().length === 0) {
                try {
                    const auxAudio = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false })
                        .catch(() => navigator.mediaDevices.getUserMedia({ audio: true, video: false }));
                    if (auxAudio && auxAudio.getAudioTracks().length > 0) {
                        currentStream.addTrack(auxAudio.getAudioTracks()[0]);
                    }
                } catch (auxErr) {}
            }

            if (!currentStream) {
                const msg = lastErr ? (lastErr.name + ': ' + lastErr.message) : '알 수 없는 오류';
                reportClientLog('permission_denied', `getUserMedia 실패: ${msg}`);
                showCameraError(
                    '⚠️ 카메라 접근 권한이 필요합니다',
                    `오류 내용: <code>${msg}</code><br><br>` +
                    `1. 아래 <strong>[📷 카메라 켜고 송출 시작]</strong> 버튼을 한 번 터치해 주세요.<br>` +
                    `2. 권한 팝업에서 <strong>[허용]</strong>을 선택해 주세요.`
                );
                document.getElementById('statusText').innerText = '카메라 터치 대기';
                document.getElementById('statusDot').style.background = '#f59e0b';
                return false;
            }

            try {
                const video = document.getElementById('cameraVideo');
                video.muted = true; // 폰 자체 스피커 하울링 방지
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.srcObject = currentStream;

                // 모바일 브라우저 자동재생 정책으로 play()가 지연/거부되더라도 스트림 송출은 즉시 시작되도록 비차단 처리
                try {
                    const playPromise = video.play();
                    if (playPromise && typeof playPromise.catch === 'function') {
                        playPromise.catch(() => {});
                    }
                } catch (e) {}

                if (facingMode === 'user') {
                    video.classList.add('mirrored');
                    document.getElementById('cameraFaceText').innerText = '전면 셀카';
                } else {
                    video.classList.remove('mirrored');
                    document.getElementById('cameraFaceText').innerText = '후면 카메라';
                }

                // 마이크 오디오 캡처 파이프라인 가동
                setupAudioCapture(currentStream);

                // 이미 연결된 WebRTC P2P 피어들의 비디오/오디오 트랙 즉시 교체 (무중단 카메라 전환)
                const newVideoTrack = currentStream.getVideoTracks()[0];
                const newAudioTrack = currentStream.getAudioTracks()[0];
                for (const [, pc] of activePeers.entries()) {
                    const senders = pc.getSenders ? pc.getSenders() : [];
                    for (const sender of senders) {
                        if (newVideoTrack && sender.track && sender.track.kind === 'video') {
                            sender.replaceTrack(newVideoTrack).catch(() => {});
                        }
                        if (newAudioTrack && sender.track && sender.track.kind === 'audio') {
                            sender.replaceTrack(newAudioTrack).catch(() => {});
                        }
                    }
                }

                document.getElementById('statusDot').style.background = '#10b981';
                updateStatusDisplay();
                reportClientLog('streaming_started', `CAM ${currentCamId} 카메라 스트림 시작됨`);
                sendInitialConnectionFrame();
                setTimeout(sendInitialConnectionFrame, 350);
                return true;
            } catch (playErr) {
                reportClientLog('error', `비디오 초기화 오류: ${playErr.message}`);
                showCameraError(
                    '⚠️ 카메라 비디오 재생 오류',
                    `비디오 스트림을 화면에 표시할 수 없습니다 (${playErr.message}). 다시 시도해 주세요.`
                );
                return false;
            }
        }

        async function switchCamera() {
            currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
            try { localStorage.setItem('live_cam_facing', currentFacing); } catch (e) {}
            await startCamera(currentFacing);
        }

        function toggleStreaming() {
            isStreaming = !isStreaming;
            const btn = document.getElementById('btnStreamToggle');
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (currentStream) {
                currentStream.getVideoTracks().forEach(t => { t.enabled = isStreaming; });
                currentStream.getAudioTracks().forEach(t => { t.enabled = isStreaming && !isMicMuted; });
            }
            syncAudioWorkerConfig();

            if (isStreaming) {
                btn.classList.add('streaming');
                btn.innerHTML = '🔴 무선 송출 중';
                dot.style.background = '#10b981';
                updateStatusDisplay();
            } else {
                btn.classList.remove('streaming');
                btn.innerHTML = '⏸️ 송출 일시정지';
                dot.style.background = '#f59e0b';
                statusText.innerText = '송출 일시정지됨';
            }
        }

        // ==========================================
        // ⚡ WebRTC Wi-Fi P2P 직결 송출 엔진 (해외 터널 경유 0%, 0.03초 무지연)
        // ==========================================
        function waitForIceGathering(pc, timeoutMs = 1500) {
            return new Promise((resolve) => {
                if (pc.iceGatheringState === 'complete') {
                    resolve();
                    return;
                }
                const timer = setTimeout(() => {
                    pc.removeEventListener('icegatheringstatechange', checkState);
                    resolve();
                }, timeoutMs);
                function checkState() {
                    if (pc.iceGatheringState === 'complete') {
                        clearTimeout(timer);
                        pc.removeEventListener('icegatheringstatechange', checkState);
                        resolve();
                    }
                }
                pc.addEventListener('icegatheringstatechange', checkState);
            });
        }

        function recalcWebrtcCount() {
            let cnt = 0;
            const now = Date.now();
            for (const [pid, pc] of activePeers.entries()) {
                const isConn = (pc.connectionState === 'connected' || pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed');
                const isDead = (
                    pc.connectionState === 'failed' ||
                    pc.connectionState === 'closed' ||
                    pc.connectionState === 'disconnected' ||
                    pc.iceConnectionState === 'failed' ||
                    pc.iceConnectionState === 'closed' ||
                    pc.iceConnectionState === 'disconnected' ||
                    (!isConn && pc._createdAt && (now - pc._createdAt) > 12000)
                );
                if (isConn) {
                    cnt++;
                } else if (isDead) {
                    try { pc.close(); } catch (e) {}
                    activePeers.delete(pid);
                }
            }
            webrtcConnectedCount = cnt;
            updateStatusDisplay();
        }

        async function handleViewerOffer(peerId, offerSdp) {
            if (!currentStream || activePeers.has(peerId)) return;
            // 동일 뷰어 프리픽스(studio_, overlay_, prompter_)의 이전 미연결 세션 즉시 정리
            const prefix = String(peerId).split('_')[0] + '_';
            for (const [oldPid, oldPc] of activePeers.entries()) {
                if (oldPid.startsWith(prefix)) {
                    const isConn = (oldPc.connectionState === 'connected' || oldPc.iceConnectionState === 'connected' || oldPc.iceConnectionState === 'completed');
                    if (!isConn) {
                        try { oldPc.close(); } catch (e) {}
                        activePeers.delete(oldPid);
                    }
                }
            }
            let pc = null;
            try {
                pc = new RTCPeerConnection(RTC_CONFIG);
                pc._createdAt = Date.now();
                activePeers.set(peerId, pc);

                pc.onconnectionstatechange = () => recalcWebrtcCount();
                pc.oniceconnectionstatechange = () => recalcWebrtcCount();

                // 오디오는 전용 AudioWorklet + Web Worker가 48kHz 무손실 PCM으로 전송하므로 WebRTC에는 비디오 트랙만 연결
                currentStream.getVideoTracks().forEach(track => {
                    pc.addTrack(track, currentStream);
                });

                await pc.setRemoteDescription(new RTCSessionDescription(offerSdp));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                await waitForIceGathering(pc, 1500);

                await fetch(`/api/camera/webrtc/answer?cam=${currentCamId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        peer_id: peerId,
                        cam: currentCamId,
                        answer: pc.localDescription
                    })
                });
                recalcWebrtcCount();
                setTimeout(recalcWebrtcCount, 12500);
            } catch (e) {
                if (pc) {
                    try { pc.close(); } catch (err) {}
                }
                activePeers.delete(peerId);
            }
        }

        let webrtcOffersInFlight = false;
        function startWebRtcSignalingLoop() {
            if (webrtcPollTimer) clearInterval(webrtcPollTimer);
            // 해외 터널(*.lhr.life) 경유 접속 중에는 WebRTC Offer/ICE 루프가 메인 스레드를 멈추게 하므로 비활성화 + 로컬 Wi-Fi 자동 전환 유도
            if (IS_TUNNEL_HOST) {
                if (LOCAL_WIFI_IP) {
                    const directUrl = getLocalDirectHttpsUrl();
                    fetch(`https://${LOCAL_WIFI_IP}:${HTTPS_PORT}/api/camera/host-info?cam=${currentCamId}`, { mode: 'cors' })
                        .then(r => {
                            if (r && r.ok) {
                                window.location.replace(directUrl);
                            }
                        })
                        .catch(() => {});
                }
                return;
            }
            webrtcPollTimer = setInterval(async () => {
                if (!isStreaming || !currentStream || webrtcOffersInFlight) return;
                webrtcOffersInFlight = true;
                recalcWebrtcCount();
                try {
                    const res = await fetch(`/api/camera/webrtc/offers?cam=${currentCamId}`);
                    if (!res.ok) return;
                    const data = await res.json();
                    const offers = data.offers || [];
                    for (const item of offers) {
                        if (item.peer_id && item.offer && !activePeers.has(item.peer_id)) {
                            handleViewerOffer(item.peer_id, item.offer);
                        }
                    }
                } catch (e) {
                } finally {
                    webrtcOffersInFlight = false;
                }
            }, 8000);
        }

        // 비상용 기본 카메라 파일 캡처 송출
        async function handleNativeCamCapture(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            try {
                document.getElementById('statusText').innerText = '사진 전송 중...';
                await fetch(`/api/camera/frame?cam=${currentCamId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': file.type || 'image/jpeg' },
                    body: file
                });
                document.getElementById('statusText').innerText = '사진 송출 완료!';
            } catch (e) {
                alert('전송 실패: ' + e.message);
            }
        }

        // ==========================================
        // 🚀 다중 병렬 파이프라이닝(In-Flight Pipelining) 프레임 루프
        // - keepalive: true(64KB 브라우저 쿼터 제한으로 인한 1FPS 드롭 현상) 완전 제거
        // - 이중 공유기(192.168.0.x <-> 192.168.1.x) 환경에서도 항상 20~30FPS 초고속 전송 유지
        // ==========================================
        function startFrameLoop() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('captureCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            function sendEncodedBody(bodyPayload, mySeq) {
                if (!bodyPayload) return;
                inFlightCount++;
                const sendStart = Date.now();
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 1200);

                fetch(`/api/camera/frame?cam=${currentCamId}&seq=${mySeq}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'image/jpeg' },
                    body: bodyPayload,
                    signal: controller.signal
                }).then((res) => {
                    clearTimeout(timeoutId);
                    if (res && res.ok) {
                        lastRttMs = Date.now() - sendStart;
                        sentFramesInSec++;
                        const tNow = Date.now();
                        if (tNow - lastFpsTime >= 1000) {
                            measuredFps = sentFramesInSec;
                            sentFramesInSec = 0;
                            lastFpsTime = tNow;
                            updateStatusDisplay();
                        }
                    }
                }).catch(() => {
                    clearTimeout(timeoutId);
                }).finally(() => {
                    inFlightCount = Math.max(0, inFlightCount - 1);
                });
            }

            // 카메라가 켜져 있는 동안 2.5초마다 상태 하트비트 전송 (네트워크 지연 중에도 '연결 대기'로 빠지지 않도록 보장)
            setInterval(() => {
                if (isStreaming && currentStream) {
                    reportClientLog('streaming', '실시간 영상 송출 중');
                }
            }, 2500);

            function loopTick() {
                const now = Date.now();
                const minIntervalMs = Math.max(25, Math.round(1000 / targetFps));

                if (
                    isStreaming &&
                    !encodingInProgress &&
                    inFlightCount < MAX_IN_FLIGHT &&
                    (now - lastCaptureTime) >= minIntervalMs &&
                    video.readyState >= 1 &&
                    video.videoWidth > 0 &&
                    video.videoHeight > 0
                ) {
                    lastCaptureTime = now;
                    encodingInProgress = true;
                    const mySeq = ++frameSeq;

                    const vw = video.videoWidth;
                    const vh = video.videoHeight;
                    const maxDim = Math.round(targetResHeight * (16 / 9));
                    const scale = Math.min(maxDim / Math.max(vw, vh), 1);
                    const cw = Math.round(vw * scale);
                    const ch = Math.round(vh * scale);
                    if (canvas.width !== cw || canvas.height !== ch) {
                        canvas.width = cw;
                        canvas.height = ch;
                    }

                    if (currentFacing === 'user') {
                        ctx.save();
                        ctx.translate(canvas.width, 0);
                        ctx.scale(-1, 1);
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        ctx.restore();
                    } else {
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    }

                    if (typeof canvas.toBlob === 'function') {
                        canvas.toBlob((blob) => {
                            encodingInProgress = false;
                            if (blob) {
                                sendEncodedBody(blob, mySeq);
                            } else {
                                const fallbackBytes = dataUrlToUint8Array(canvas.toDataURL('image/jpeg', targetJpegQuality));
                                sendEncodedBody(fallbackBytes, mySeq);
                            }
                        }, 'image/jpeg', targetJpegQuality);
                    } else {
                        encodingInProgress = false;
                        const fallbackBytes = dataUrlToUint8Array(canvas.toDataURL('image/jpeg', targetJpegQuality));
                        sendEncodedBody(fallbackBytes, mySeq);
                    }
                }
                requestAnimationFrame(loopTick);
            }
            requestAnimationFrame(loopTick);
        }

        // 모바일 브라우저 자동 재연결 후 화면 터치 시 AudioContext 즉시 활성화
        ['touchend', 'pointerup', 'click', 'touchstart'].forEach(evtName => {
            window.addEventListener(evtName, () => {
                if (audioCtx && audioCtx.state === 'suspended' && !isMicMuted) {
                    audioCtx.resume().then(() => {
                        updateMicButtonUi();
                        updateStatusDisplay();
                    }).catch(() => {});
                }
            }, { passive: true });
        });
    </script>
