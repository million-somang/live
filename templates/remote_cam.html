<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌐 원격 네트워크 스마트폰 카메라 (CAM {{ cam_id }}) | Live Commerce OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background: #0f172a;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        #remoteCamVideo {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            inset: 0;
            z-index: 1;
            background: #0f172a;
        }
        #remoteCamVideo.mirrored {
            transform: scaleX(-1);
        }
        #remoteCaptureCanvas {
            display: none;
        }
        /* 상단 상태 오버레이 바 */
        .top-bar {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.94);
            color: #0f172a;
            border: 1.5px solid #cbd5e1;
            border-radius: 16px;
            padding: 10px 14px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25);
        }
        .cam-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #2563eb;
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .cam-badge.cam2 {
            background: #0284c7;
        }
        .status-text {
            font-size: 0.8rem;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #94a3b8;
            display: inline-block;
        }
        .dot.live {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }
        .fps-pill {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #334155;
            font-size: 0.74rem;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 999px;
            white-space: nowrap;
        }
        /* 중앙 시작 안내 카드 */
        .center-start-overlay {
            position: absolute;
            inset: 0;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(6px);
        }
        .start-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            color: #0f172a;
            border-radius: 22px;
            padding: 24px 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .btn-start-main {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 15px 18px;
            font-size: 1rem;
            font-weight: 900;
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
            cursor: pointer;
        }
        /* 하단 컨트롤 독 */
        .bottom-controls {
            position: absolute;
            bottom: 18px;
            left: 14px;
            right: 14px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.94);
            color: #0f172a;
            border: 1.5px solid #cbd5e1;
            border-radius: 18px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
        }
        .ctrl-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        .ctrl-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            font-size: 0.76rem;
            font-weight: 800;
            padding: 9px 6px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }
        .ctrl-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
        }
        .ctrl-btn.danger {
            background: #fef2f2;
            border-color: #fca5a5;
            color: #dc2626;
        }
    </style>
</head>
<body>

    <video id="remoteCamVideo" autoplay playsinline muted></video>
    <canvas id="remoteCaptureCanvas"></canvas>

    <!-- 상단 상태 바 -->
    <div class="top-bar">
        <div style="display:flex; align-items:center; gap:8px;">
            <span class="cam-badge {% if cam_id == 2 %}cam2{% endif %}" id="topCamSlotBadge">
                🌐 원격 CAM {{ cam_id }}
            </span>
            <div class="status-text">
                <span class="dot" id="topLiveDot"></span>
                <span id="topStatusLabel">카메라 대기 중</span>
            </div>
        </div>
        <span class="fps-pill" id="topFpsPill">0 FPS · P2P/원격</span>
    </div>

    <!-- 중앙 시작 안내 오버레이 -->
    <div class="center-start-overlay" id="startOverlay">
        <div class="start-card">
            <div style="font-size:2.4rem;">📱🌐</div>
            <h2 style="font-size:1.2rem; font-weight:900; color:#0f172a;">
                다른 네트워크 원격 카메라 (CAM {{ cam_id }})
            </h2>
            <p style="font-size:0.84rem; color:#475569; line-height:1.5;">
                동일 Wi-Fi가 아닌 <strong>LTE/5G 또는 외부 네트워크</strong>에서<br>
                OBS 스튜디오로 카메라 영상을 실시간 전송합니다.
            </p>

            <div id="httpsNoticeBox" style="display:none; background:#fff1f2; border:1.5px solid #f43f5e; border-radius:12px; padding:12px; font-size:0.8rem; color:#be123c; line-height:1.5;">
                🔒 스마트폰 브라우저는 <strong>HTTPS 보안 연결</strong>에서만 카메라 권한이 허용됩니다.<br>
                아래 버튼을 누른 뒤 <strong>[고급] ➔ [안전하지 않음으로 이동(웹사이트 방문)]</strong>을 1회 눌러주세요.
                <a id="httpsRedirectBtn" href="{{ https_remote_url }}" style="display:block; margin-top:8px; background:#e11d48; color:#fff; text-decoration:none; font-weight:900; padding:10px; border-radius:8px;">
                    🔒 HTTPS 보안 카메라 페이지로 이동 ➔
                </a>
            </div>

            <button type="button" class="btn-start-main" id="btnStartRemoteCam" onclick="startRemoteCameraStreaming()">
                📹 카메라 켜고 스튜디오로 영상 보내기
            </button>
        </div>
    </div>

    <!-- 하단 컨트롤 바 -->
    <div class="bottom-controls">
        <div class="ctrl-row">
            <button type="button" class="ctrl-btn" onclick="switchFacingMode()">🔄 전/후면</button>
            <button type="button" class="ctrl-btn active" id="btnRemoteMicToggle" onclick="toggleRemoteMicMute()">🎤 마이크 ON</button>
            <button type="button" class="ctrl-btn" id="btnMirrorToggle" onclick="toggleRemoteMirror()">🪞 좌우반전</button>
            <button type="button" class="ctrl-btn active" id="btnQualityToggle" onclick="toggleRemoteQuality()">📐 화질: 720p</button>
            <button type="button" class="ctrl-btn" id="btnSlotToggle" onclick="switchRemoteCamSlot()">🎥 CAM {{ cam_id }}</button>
        </div>
    </div>

    <script>
        const CAM_TOKEN = {{ (cam_token or '') | tojson }};
        const HTTPS_REMOTE_URL = {{ (https_remote_url or '') | tojson }};
        let currentCamSlot = Number({{ cam_id or 1 }});
        let currentFacingMode = 'environment';
        let isMirrored = false;
        let isHighQuality = true; // true: 720p, false: 480p
        let mediaStream = null;
        let isStreaming = false;
        let frameSeq = 0;
        let sentFramesInSec = 0;
        let peerConnection = null;

        // 🎤 원격 카메라 실시간 마이크 오디오(48kHz 16-bit Mono PCM) 캡처 및 전송 상태
        let isMicMuted = false;
        try {
            const savedMute = localStorage.getItem(`remote_cam_mic_muted_cam${currentCamSlot}`);
            if (savedMute === '1') isMicMuted = true;
        } catch (e) {}
        let hasAudioTrack = false;
        let audioCtx = null;
        let audioSourceNode = null;
        let audioProcessorNode = null;
        let audioGainNode = null;
        let audioWorkletReady = false;
        let audioUploadWorker = null;
        let audioInFlightCount = 0;
        const MAX_AUDIO_IN_FLIGHT = 2;
        let audioSeq = 0;
        let pendingPcmChunks = [];
        let pendingPcmSamples = 0;
        const TARGET_AUDIO_SAMPLE_RATE = 48000;
        const AUDIO_PACKET_SAMPLES = 3840; // 80ms @ 48kHz (초당 12.5패킷으로 HTTP 오버헤드 50% 절감)

        const videoEl = document.getElementById('remoteCamVideo');
        const canvasEl = document.getElementById('remoteCaptureCanvas');
        const ctx = canvasEl.getContext('2d', { alpha: false });

        // HTTP 접속 시 카메라 API(navigator.mediaDevices)가 차단된 경우 즉시 HTTPS 보안 포트로 안내
        if (window.location.protocol !== 'https:' && !navigator.mediaDevices && HTTPS_REMOTE_URL) {
            document.getElementById('httpsNoticeBox').style.display = 'block';
            document.getElementById('btnStartRemoteCam').style.display = 'none';
        }

        function buildApiUrl(path) {
            const sep = path.includes('?') ? '&' : '?';
            return `${path}${sep}cam=${currentCamSlot}&cam_token=${encodeURIComponent(CAM_TOKEN)}`;
        }

        function ensureAudioUploadWorker() {
            if (audioUploadWorker) return audioUploadWorker;
            if (typeof Worker === 'undefined') return null;
            const workerCode = `
                let uploadUrlBase = '';
                let isActive = false;
                let audioInFlightCount = 0;
                const MAX_AUDIO_IN_FLIGHT = 2;
                const AUDIO_PACKET_SAMPLES = 3840;
                const MAX_BUFFER_SAMPLES = 36000;
                let audioSeq = 0;
                let pendingPcmChunks = [];
                let pendingPcmSamples = 0;

                function onPcmChunk(pcm16) {
                    if (!isActive || !pcm16 || !pcm16.length) return;
                    pendingPcmChunks.push(pcm16);
                    pendingPcmSamples += pcm16.length;
                    if (pendingPcmSamples >= AUDIO_PACKET_SAMPLES && audioInFlightCount < MAX_AUDIO_IN_FLIGHT) {
                        flushAudioChunks();
                    }
                }

                async function flushAudioChunks() {
                    if (!isActive || !uploadUrlBase || audioInFlightCount >= MAX_AUDIO_IN_FLIGHT || pendingPcmSamples < AUDIO_PACKET_SAMPLES) return;
                    audioInFlightCount++;
                    const mySeq = ++audioSeq;
                    try {
                        const chunks = pendingPcmChunks;
                        const totalSamples = pendingPcmSamples;
                        pendingPcmChunks = [];
                        pendingPcmSamples = 0;

                        const merged = new Int16Array(totalSamples);
                        let offset = 0;
                        for (let i = 0; i < chunks.length; i++) {
                            merged.set(chunks[i], offset);
                            offset += chunks[i].length;
                        }
                        const payload = totalSamples > MAX_BUFFER_SAMPLES
                            ? merged.subarray(totalSamples - MAX_BUFFER_SAMPLES)
                            : merged;

                        const sep = uploadUrlBase.includes('?') ? '&' : '?';
                        const url = uploadUrlBase + sep + 'seq=' + mySeq;
                        const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
                        const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, 1500) : null;
                        try {
                            await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/octet-stream' },
                                body: new Uint8Array(payload.buffer, payload.byteOffset, payload.byteLength),
                                signal: ctrl ? ctrl.signal : undefined
                            });
                        } finally {
                            if (timer) clearTimeout(timer);
                        }
                    } catch (e) {
                    } finally {
                        audioInFlightCount = Math.max(0, audioInFlightCount - 1);
                        if (pendingPcmSamples >= AUDIO_PACKET_SAMPLES && audioInFlightCount < MAX_AUDIO_IN_FLIGHT) {
                            flushAudioChunks();
                        }
                    }
                }

                self.onmessage = (ev) => {
                    const msg = ev.data || {};
                    if (msg.type === 'config') {
                        if (typeof msg.uploadUrlBase === 'string') uploadUrlBase = msg.uploadUrlBase;
                        if (typeof msg.active === 'boolean') {
                            isActive = msg.active;
                            if (!isActive) {
                                pendingPcmChunks = [];
                                pendingPcmSamples = 0;
                            }
                        }
                    } else if (msg.type === 'bindPort' && msg.port) {
                        msg.port.onmessage = (pEv) => {
                            onPcmChunk(pEv.data);
                        };
                    } else if (msg.type === 'pcm' && msg.pcm) {
                        onPcmChunk(msg.pcm);
                    }
                };
            `;
            try {
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                audioUploadWorker = new Worker(URL.createObjectURL(blob));
            } catch (e) {
                try {
                    audioUploadWorker = new Worker(buildApiUrl('/api/camera/audio-worker.js'));
                } catch (e2) {
                    audioUploadWorker = null;
                }
            }
            return audioUploadWorker;
        }

        function syncAudioWorkerConfig() {
            const w = ensureAudioUploadWorker();
            if (!w) return;
            const fullBase = new URL(buildApiUrl('/api/camera/audio?sr=48000&src=mobile'), window.location.origin).toString();
            w.postMessage({
                type: 'config',
                uploadUrlBase: fullBase,
                active: Boolean(isStreaming && !isMicMuted && hasAudioTrack)
            });
        }

        function updateRemoteMicButtonUi() {
            const btn = document.getElementById('btnRemoteMicToggle');
            if (!btn) return;
            if (!hasAudioTrack && isStreaming) {
                btn.classList.remove('active');
                btn.classList.add('danger');
                btn.innerText = isMicMuted ? '🔇 마이크 OFF' : '🔇 권한없음';
            } else if (isMicMuted) {
                btn.classList.remove('active');
                btn.classList.add('danger');
                btn.innerText = '🔇 마이크 OFF';
            } else {
                btn.classList.remove('danger');
                btn.classList.add('active');
                btn.innerText = '🎤 마이크 ON';
            }
        }

        async function toggleRemoteMicMute() {
            isMicMuted = !isMicMuted;
            try { localStorage.setItem(`remote_cam_mic_muted_cam${currentCamSlot}`, isMicMuted ? '1' : '0'); } catch (e) {}
            if (!isMicMuted && !hasAudioTrack && isStreaming) {
                await startRemoteCameraStreaming();
                return;
            }
            if (mediaStream) {
                mediaStream.getAudioTracks().forEach(t => { t.enabled = !isMicMuted && isStreaming; });
            }
            if (audioCtx && audioCtx.state === 'suspended' && !isMicMuted) {
                audioCtx.resume().catch(() => {});
            }
            syncAudioWorkerConfig();
            updateRemoteMicButtonUi();
        }

        async function flushRemoteAudioPcmChunks() {
            if (audioInFlightCount >= MAX_AUDIO_IN_FLIGHT || pendingPcmSamples < AUDIO_PACKET_SAMPLES) return;
            audioInFlightCount++;
            const myAudioSeq = ++audioSeq;
            try {
                const chunks = pendingPcmChunks;
                const totalSamples = pendingPcmSamples;
                pendingPcmChunks = [];
                pendingPcmSamples = 0;

                const merged = new Int16Array(totalSamples);
                let offset = 0;
                for (const c of chunks) {
                    merged.set(c, offset);
                    offset += c.length;
                }
                const payload = totalSamples > 36000 ? merged.subarray(totalSamples - 36000) : merged;

                const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
                const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, 1500) : null;
                try {
                    await fetch(buildApiUrl(`/api/camera/audio?sr=48000&src=mobile&seq=${myAudioSeq}`), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/octet-stream' },
                        body: new Uint8Array(payload.buffer, payload.byteOffset, payload.byteLength),
                        signal: ctrl ? ctrl.signal : undefined
                    });
                } finally {
                    if (timer) clearTimeout(timer);
                }
            } catch (e) {
            } finally {
                audioInFlightCount = Math.max(0, audioInFlightCount - 1);
                if (pendingPcmSamples >= AUDIO_PACKET_SAMPLES && audioInFlightCount < MAX_AUDIO_IN_FLIGHT) {
                    flushRemoteAudioPcmChunks();
                }
            }
        }

        function attachRemoteScriptProcessorFallback(inRate) {
            if (!audioCtx || !audioSourceNode || !audioGainNode) return;
            try {
                if (audioProcessorNode) {
                    try { audioProcessorNode.disconnect(); } catch (e) {}
                }
                audioProcessorNode = audioCtx.createScriptProcessor(4096, 1, 1);
                const effRate = inRate || audioCtx.sampleRate || 48000;
                const worker = ensureAudioUploadWorker();
                syncAudioWorkerConfig();
                audioProcessorNode.onaudioprocess = (event) => {
                    if (!isStreaming || isMicMuted || !hasAudioTrack) return;
                    const inputData = event.inputBuffer.getChannelData(0);
                    if (!inputData || inputData.length === 0) return;

                    const outLength = Math.max(1, Math.floor(inputData.length / (effRate / TARGET_AUDIO_SAMPLE_RATE)));
                    const ratio = inputData.length / outLength;
                    const pcm16 = new Int16Array(outLength);
                    const inLen = inputData.length;
                    for (let i = 0; i < outLength; i++) {
                        const startF = i * ratio;
                        const endF = startF + ratio;
                        const startIdx = Math.min(inLen - 1, Math.floor(startF));
                        const endIdx = Math.min(inLen, Math.max(startIdx + 1, Math.ceil(endF)));
                        let sum = 0;
                        let cnt = 0;
                        for (let j = startIdx; j < endIdx; j++) {
                            sum += inputData[j];
                            cnt++;
                        }
                        let sample = (cnt > 0 ? (sum / cnt) : inputData[startIdx]);
                        if (sample > 0.98) sample = 0.98;
                        else if (sample < -0.98) sample = -0.98;
                        pcm16[i] = sample < 0 ? Math.round(sample * 0x8000) : Math.round(sample * 0x7FFF);
                    }

                    if (worker) {
                        worker.postMessage({ type: 'pcm', pcm: pcm16 }, [pcm16.buffer]);
                    } else {
                        pendingPcmChunks.push(pcm16);
                        pendingPcmSamples += pcm16.length;
                        if (pendingPcmSamples >= AUDIO_PACKET_SAMPLES && audioInFlightCount < MAX_AUDIO_IN_FLIGHT) {
                            flushRemoteAudioPcmChunks();
                        }
                    }
                };
                audioSourceNode.connect(audioProcessorNode);
                audioProcessorNode.connect(audioGainNode);
                audioGainNode.connect(audioCtx.destination);
            } catch (e) {}
        }

        async function setupRemoteAudioCapture(stream) {
            try {
                const audioTracks = stream ? stream.getAudioTracks() : [];
                hasAudioTrack = audioTracks.length > 0;
                if (!hasAudioTrack) {
                    syncAudioWorkerConfig();
                    updateRemoteMicButtonUi();
                    return;
                }
                audioTracks.forEach(t => { t.enabled = !isMicMuted && isStreaming; });
                syncAudioWorkerConfig();
                updateRemoteMicButtonUi();

                if (audioProcessorNode) {
                    try { audioProcessorNode.disconnect(); } catch (e) {}
                    audioProcessorNode = null;
                }
                if (audioSourceNode) {
                    try { audioSourceNode.disconnect(); } catch (e) {}
                    audioSourceNode = null;
                }

                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                if (!audioCtx) {
                    try {
                        audioCtx = new AudioContextClass({ sampleRate: 48000 });
                    } catch (e) {
                        audioCtx = new AudioContextClass();
                    }
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }

                const dedicatedAudioStream = new MediaStream([audioTracks[0]]);
                audioSourceNode = audioCtx.createMediaStreamSource(dedicatedAudioStream);
                audioGainNode = audioCtx.createGain();
                audioGainNode.gain.value = 0;

                const inRate = audioCtx.sampleRate || 48000;
                if (audioCtx.audioWorklet && window.AudioWorkletNode) {
                    try {
                        if (!audioWorkletReady) {
                            try {
                                await audioCtx.audioWorklet.addModule(buildApiUrl('/api/camera/mic-worklet.js'));
                                audioWorkletReady = true;
                            } catch (modErr) {
                                const workletCode = `
                                    class MicPcmWorklet extends AudioWorkletProcessor {
                                        constructor() {
                                            super();
                                            this.outBuf = new Int16Array(1920);
                                            this.outIdx = 0;
                                            this.srcPos = 0;
                                            this.dcX = 0;
                                            this.dcY = 0;
                                            this.prevSample = 0;
                                            this.hasPrev = false;
                                            this.filteredBuf = new Float32Array(256);
                                            this.workerPort = null;
                                            this.notifiedAlive = false;
                                            this.port.onmessage = (ev) => {
                                                if (ev.data && ev.data.workerPort) {
                                                    this.workerPort = ev.data.workerPort;
                                                }
                                            };
                                        }
                                        process(inputs) {
                                            const input = inputs[0];
                                            if (!input || !input[0] || input[0].length === 0) return true;
                                            const ch = input[0];
                                            const inLen = ch.length;
                                            if (this.filteredBuf.length < inLen) {
                                                this.filteredBuf = new Float32Array(inLen);
                                            }
                                            let dcX = this.dcX, dcY = this.dcY;
                                            for (let i = 0; i < inLen; i++) {
                                                const x = ch[i];
                                                dcY = x - dcX + 0.995 * dcY;
                                                dcX = x;
                                                this.filteredBuf[i] = dcY;
                                            }
                                            this.dcX = dcX;
                                            this.dcY = dcY;
                                            const ratio = sampleRate / 48000;
                                            const fBuf = this.filteredBuf;
                                            while (this.srcPos < inLen) {
                                                const idx = Math.floor(this.srcPos);
                                                const frac = this.srcPos - idx;
                                                let s0, s1;
                                                if (idx < 0) {
                                                    s0 = this.hasPrev ? this.prevSample : fBuf[0];
                                                    s1 = fBuf[0];
                                                } else if (idx >= inLen - 1) {
                                                    s0 = fBuf[inLen - 1];
                                                    s1 = fBuf[inLen - 1];
                                                } else {
                                                    s0 = fBuf[idx];
                                                    s1 = fBuf[idx + 1];
                                                }
                                                let s = (s0 * (1 - frac) + s1 * frac);
                                                if (s > 0.98) s = 0.98;
                                                else if (s < -0.98) s = -0.98;
                                                this.outBuf[this.outIdx++] = s < 0 ? Math.round(s * 0x8000) : Math.round(s * 0x7FFF);
                                                if (this.outIdx >= 1920) {
                                                    const chunk = this.outBuf.slice(0);
                                                    if (this.workerPort) {
                                                        this.workerPort.postMessage(chunk, [chunk.buffer]);
                                                        if (!this.notifiedAlive) {
                                                            this.notifiedAlive = true;
                                                            this.port.postMessage('alive');
                                                        }
                                                    } else {
                                                        this.port.postMessage(chunk, [chunk.buffer]);
                                                    }
                                                    this.outIdx = 0;
                                                }
                                                this.srcPos += ratio;
                                            }
                                            this.prevSample = fBuf[inLen - 1];
                                            this.hasPrev = true;
                                            this.srcPos -= inLen;
                                            return true;
                                        }
                                    }
                                    registerProcessor('mic-pcm-worklet', MicPcmWorklet);
                                `;
                                const blob = new Blob([workletCode], { type: 'application/javascript' });
                                const url = URL.createObjectURL(blob);
                                await audioCtx.audioWorklet.addModule(url);
                                audioWorkletReady = true;
                            }
                        }
                        let workletDeliveries = 0;
                        const workletNode = new AudioWorkletNode(audioCtx, 'mic-pcm-worklet');
                        audioProcessorNode = workletNode;
                        const worker = ensureAudioUploadWorker();
                        syncAudioWorkerConfig();
                        if (worker && typeof MessageChannel !== 'undefined') {
                            try {
                                const mc = new MessageChannel();
                                workletNode.port.postMessage({ workerPort: mc.port1 }, [mc.port1]);
                                worker.postMessage({ type: 'bindPort', port: mc.port2 }, [mc.port2]);
                            } catch (mcErr) {}
                        }
                        workletNode.port.onmessage = (ev) => {
                            workletDeliveries++;
                            if (ev.data === 'alive') return;
                            if (!isStreaming || isMicMuted || !hasAudioTrack) return;
                            const pcm16 = ev.data;
                            if (!pcm16 || !pcm16.length) return;
                            if (worker) {
                                worker.postMessage({ type: 'pcm', pcm: pcm16 }, [pcm16.buffer]);
                            } else {
                                pendingPcmChunks.push(pcm16);
                                pendingPcmSamples += pcm16.length;
                                if (pendingPcmSamples >= AUDIO_PACKET_SAMPLES && audioInFlightCount < MAX_AUDIO_IN_FLIGHT) {
                                    flushRemoteAudioPcmChunks();
                                }
                            }
                        };
                        audioSourceNode.connect(workletNode);
                        workletNode.connect(audioGainNode);
                        audioGainNode.connect(audioCtx.destination);

                        // AudioContext가 실제로 running 상태인 시간 기준 2.5초 동안 콜백이 전혀 없을 때만 ScriptProcessor로 폴백
                        let runningWaitTicks = 0;
                        const fbTimer = setInterval(() => {
                            if (workletDeliveries > 0 || audioProcessorNode !== workletNode) {
                                clearInterval(fbTimer);
                                return;
                            }
                            if (isStreaming && !isMicMuted && hasAudioTrack && audioCtx && audioCtx.state === 'running') {
                                runningWaitTicks++;
                                if (runningWaitTicks >= 5) {
                                    clearInterval(fbTimer);
                                    attachRemoteScriptProcessorFallback(inRate);
                                }
                            }
                        }, 500);
                        return;
                    } catch (wErr) {}
                }

                attachRemoteScriptProcessorFallback(inRate);
            } catch (e) {}
        }

        async function reportClientState(state, message) {
            try {
                await fetch(buildApiUrl('/api/camera/client-log'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cam: currentCamSlot,
                        state: state,
                        message: message,
                        protocol: 'remote_network'
                    })
                });
            } catch (e) {}
        }

        async function startRemoteCameraStreaming() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                if (HTTPS_REMOTE_URL && window.location.protocol !== 'https:') {
                    window.location.href = HTTPS_REMOTE_URL;
                    return;
                }
                alert('이 브라우저에서 카메라 권한을 사용할 수 없습니다. HTTPS 보안 주소로 접속해 주세요.');
                return;
            }

            try {
                await reportClientState('requesting_camera', '원격 카메라 및 마이크 권한 요청 중');
                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                    mediaStream = null;
                }

                const targetW = isHighQuality ? 1280 : 854;
                const targetH = isHighQuality ? 720 : 480;
                const audioConstraints = {
                    echoCancellation: false,
                    noiseSuppression: true,
                    autoGainControl: true,
                    channelCount: { ideal: 1 },
                    sampleRate: { ideal: 48000 }
                };
                const videoConstraints = {
                    facingMode: { ideal: currentFacingMode },
                    width: { ideal: targetW },
                    height: { ideal: targetH },
                    frameRate: { ideal: 24, max: 30 }
                };

                const candidates = isMicMuted
                    ? [
                        { video: videoConstraints, audio: false },
                        { video: { facingMode: currentFacingMode }, audio: false },
                        { video: true, audio: false }
                    ]
                    : [
                        { video: videoConstraints, audio: audioConstraints },
                        { video: { facingMode: currentFacingMode }, audio: audioConstraints },
                        { video: videoConstraints, audio: true },
                        { video: true, audio: true },
                        { video: videoConstraints, audio: false },
                        { video: true, audio: false }
                    ];

                let lastErr = null;
                for (const c of candidates) {
                    try {
                        mediaStream = await navigator.mediaDevices.getUserMedia(c);
                        if (mediaStream) break;
                    } catch (err) {
                        lastErr = err;
                    }
                }
                if (!mediaStream) {
                    throw lastErr || new Error('카메라 스트림을 열 수 없습니다.');
                }

                // 비디오만 열린 경우 마이크 트랙 별도 결합 시도
                if (!isMicMuted && mediaStream.getAudioTracks().length === 0) {
                    try {
                        const aStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false })
                            .catch(() => navigator.mediaDevices.getUserMedia({ audio: true, video: false }));
                        if (aStream && aStream.getAudioTracks().length > 0) {
                            mediaStream.addTrack(aStream.getAudioTracks()[0]);
                        }
                    } catch (aErr) {}
                }

                videoEl.muted = true;
                videoEl.srcObject = mediaStream;
                try {
                    const p = videoEl.play();
                    if (p && typeof p.catch === 'function') p.catch(() => {});
                } catch (e) {}

                document.getElementById('startOverlay').style.display = 'none';
                document.getElementById('topLiveDot').classList.add('live');
                isStreaming = true;

                await setupRemoteAudioCapture(mediaStream);
                const micTag = (hasAudioTrack && !isMicMuted) ? ' (🎤음성ON)' : '';
                document.getElementById('topStatusLabel').innerText = `스튜디오로 실시간 전송 중${micTag}`;

                await reportClientState('streaming_started', `원격 네트워크 카메라 실시간 송출 시작${micTag}`);
                startFrameUploadLoop();
                startWebRtcOfferPolling();
            } catch (err) {
                await reportClientState('permission_denied', err.message || '카메라 권한 거부');
                alert('카메라 시작 실패: ' + (err.message || err));
            }
        }

        let frameLoopRunning = false;
        let webrtcPollRunning = false;

        // 1) 원격 프레임 전송 루프 (모든 NAT/방화벽 100% 통과 보장)
        async function startFrameUploadLoop() {
            if (frameLoopRunning) return;
            frameLoopRunning = true;
            let busy = false;
            setInterval(() => {
                if (!isStreaming || busy || !videoEl.videoWidth || !videoEl.videoHeight) return;
                busy = true;

                const vw = videoEl.videoWidth;
                const vh = videoEl.videoHeight;
                const maxDim = isHighQuality ? 854 : 640;
                const scale = Math.min(maxDim / Math.max(vw, vh), 1);
                const cw = Math.round(vw * scale);
                const ch = Math.round(vh * scale);

                if (canvasEl.width !== cw || canvasEl.height !== ch) {
                    canvasEl.width = cw;
                    canvasEl.height = ch;
                }

                if (isMirrored) {
                    ctx.save();
                    ctx.scale(-1, 1);
                    ctx.drawImage(videoEl, -cw, 0, cw, ch);
                    ctx.restore();
                } else {
                    ctx.drawImage(videoEl, 0, 0, cw, ch);
                }

                const quality = isHighQuality ? 0.66 : 0.56;
                canvasEl.toBlob(async (blob) => {
                    if (!blob) {
                        busy = false;
                        return;
                    }
                    const seq = ++frameSeq;
                    try {
                        await fetch(buildApiUrl(`/api/remote-cam/frame?seq=${seq}&src=remote_cam_${currentCamSlot}`), {
                            method: 'POST',
                            body: blob,
                            headers: { 'Content-Type': 'image/jpeg' }
                        });
                        sentFramesInSec++;
                    } catch (e) {
                    } finally {
                        busy = false;
                    }
                }, 'image/jpeg', quality);
            }, 50);
        }

        // 2) WebRTC P2P Offer 폴링 & Answer 응답 (P2P 직접 연결 지원 시 초저지연 스트리밍)
        function startWebRtcOfferPolling() {
            if (webrtcPollRunning) return;
            webrtcPollRunning = true;
            setInterval(async () => {
                if (!isStreaming || !mediaStream || !window.RTCPeerConnection) return;
                try {
                    const res = await fetch(buildApiUrl('/api/remote-cam/signal'));
                    if (!res.ok) return;
                    const data = await res.json();
                    const offers = data.offers || [];
                    if (!offers.length) return;

                    for (const item of offers) {
                        await answerViewerOffer(item.peer_id, item.offer);
                    }
                } catch (e) {}
            }, 1500);
        }

        async function answerViewerOffer(peerId, offer) {
            try {
                const pc = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                });
                mediaStream.getTracks().forEach(track => pc.addTrack(track, mediaStream));
                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                await new Promise((resolve) => {
                    if (pc.iceGatheringState === 'complete') return resolve();
                    const t = setTimeout(resolve, 1200);
                    pc.onicegatheringstatechange = () => {
                        if (pc.iceGatheringState === 'complete') {
                            clearTimeout(t);
                            resolve();
                        }
                    };
                });

                await fetch(buildApiUrl('/api/remote-cam/signal'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'answer',
                        peer_id: peerId,
                        cam: currentCamSlot,
                        answer: {
                            type: pc.localDescription.type,
                            sdp: pc.localDescription.sdp
                        }
                    })
                });
            } catch (e) {}
        }

        setInterval(() => {
            const pill = document.getElementById('topFpsPill');
            if (pill) {
                pill.innerText = `${sentFramesInSec} FPS · ${isHighQuality ? '720p' : '480p'}`;
            }
            sentFramesInSec = 0;
        }, 1000);

        function switchFacingMode() {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            if (isStreaming) startRemoteCameraStreaming();
        }

        function toggleRemoteMirror() {
            isMirrored = !isMirrored;
            videoEl.classList.toggle('mirrored', isMirrored);
            document.getElementById('btnMirrorToggle').classList.toggle('active', isMirrored);
        }

        function toggleRemoteQuality() {
            isHighQuality = !isHighQuality;
            const btn = document.getElementById('btnQualityToggle');
            btn.innerText = isHighQuality ? '📐 화질: 720p' : '📐 화질: 480p';
            btn.classList.toggle('active', isHighQuality);
            if (isStreaming) startRemoteCameraStreaming();
        }

        function switchRemoteCamSlot() {
            currentCamSlot = currentCamSlot === 1 ? 2 : 1;
            const badge = document.getElementById('topCamSlotBadge');
            const btn = document.getElementById('btnSlotToggle');
            badge.innerText = `🌐 원격 CAM ${currentCamSlot}`;
            badge.classList.toggle('cam2', currentCamSlot === 2);
            btn.innerText = `🎥 CAM ${currentCamSlot}`;
        }

        ['touchend', 'pointerup', 'click'].forEach(evtName => {
            window.addEventListener(evtName, () => {
                if (audioCtx && audioCtx.state === 'suspended' && !isMicMuted) {
                    audioCtx.resume().catch(() => {});
                }
            }, { passive: true });
        });

        updateRemoteMicButtonUi();
        reportClientState('page_loaded', '원격 카메라 페이지(/remote-cam) 열림');
    </script>
</body>
