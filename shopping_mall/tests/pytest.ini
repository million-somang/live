[pytest]
testpaths = e2e
norecursedirs = __pycache__ .git
addopts = -ra --strict-markers
markers =
    tier1: Tier 1 feature happy-path E2E tests
    tier2: Tier 2 boundary, negative, auth, and security E2E tests
    tier3: Tier 3 pairwise cross-feature E2E tests
    tier4: Tier 4 real-world multi-actor Playwright scenarios and layout/CSRF regression
    smoke: Harness self-check smoke tests
    layout: Desktop/mobile layout and internal vertical scroll checks
    regression: Route rendering, CSRF, and store vs /live isolation regression
    f1: Feature F1 - R1 bank account dynamic store_info linkage
    f2: Feature F2 - R1 related_products UI
    f3: Feature F3 - R1+R2 zipcode and Daum postcode integration
    f4: Feature F4 - R1 global 4,000 KRW shipping fee hardcode removal
    f5: Feature F5 - R2 store shipping fee and free-shipping threshold
    f6: Feature F6 - R2 logistics carrier, tracking, CSV export/import, and 1-click tracking
    f7: Feature F7 - R2 customer self-cancel and exchange/return claims
    f8: Feature F8 - R2 member /mypage, address book, password reset, and withdraw
    f9: Feature F9 - R2 admin member management tab
    f10: Feature F10 - R3 bank transfer enhancements, /order-complete, and PG adapter
    f11: Feature F11 - R3 product Q&A (secret), 1:1 inquiry, notices, and FAQ
    f12: Feature F12 - R3 multi-channel notification service (LOGGED_ONLY fallback)
    f13: Feature F13 - R3 photo review, verified buyer badge, edit/delete, and moderation
    f14: Feature F14 - R4 welcome coupon, live promo code, and loyalty points
    f15: Feature F15 - R4 cart selection, option change, and pre-checkout revalidation
    f16: Feature F16 - R4 catalog filters/pagination, recent viewed bar, and restock alerts
    f17: Feature F17 - R4 SEO (OpenGraph, sitemap.xml, robots.txt)
    f18: Feature F18 - R4 ops automation (auto-cancel, DB backup, audit logs)
